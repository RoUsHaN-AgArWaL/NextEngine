<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Downloads</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0d1118;
      --panel: rgba(24, 31, 43, .86);
      --panel-hover: rgba(31, 41, 56, .95);
      --border: rgba(151, 169, 194, .2);
      --text: #edf3fb;
      --muted: #9caabd;
      --accent: #7dd3fc;
      --danger: #fca5a5;
      --shadow: 0 18px 60px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at top right, #20344b 0, transparent 42%), var(--background);
      font: 14px/1.45 "Segoe UI", sans-serif;
    }
    main { width: min(980px, 100%); margin: 0 auto; padding: 52px 28px 72px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    h1 { margin: 0; font-size: 32px; letter-spacing: .01em; }
    header p { margin: 7px 0 0; color: var(--muted); }
    button {
      border: 1px solid var(--border); border-radius: 7px; padding: 9px 13px;
      color: var(--text); background: rgba(255, 255, 255, .04); cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, .1); border-color: rgba(125, 211, 252, .55); }
    #clear-history { color: var(--danger); }
    #downloads { display: grid; gap: 13px; }
    .download {
      padding: 20px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--panel); box-shadow: var(--shadow); transition: background .16s ease, transform .16s ease;
    }
    .download:hover { background: var(--panel-hover); transform: translateY(-1px); }
    .download-top { display: flex; align-items: flex-start; gap: 15px; }
    .file-icon { width: 42px; height: 48px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 7px; color: var(--accent); font-size: 11px; font-weight: 700; }
    .details { min-width: 0; flex: 1; }
    .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; font-weight: 600; }
    .meta { margin-top: 4px; color: var(--muted); font-size: 12px; }
    .status { color: var(--accent); font-size: 13px; white-space: nowrap; }
    .progress-track { height: 5px; margin: 16px 0 9px; overflow: hidden; border-radius: 5px; background: rgba(255, 255, 255, .09); }
    .progress { height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }
    .stats { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 12px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
    .actions button { padding: 7px 10px; font-size: 12px; }
    .actions .remove { color: var(--danger); }
    #empty { padding: 80px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); border-radius: 10px; }
    #empty strong { display: block; margin-bottom: 6px; color: var(--text); font-size: 17px; }
    @media (max-width: 600px) {
      main { padding: 30px 16px 56px; }
      header { align-items: flex-start; flex-direction: column; }
      .download-top { gap: 10px; }
      .status { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Downloads</h1>
        <p>All your downloaded files</p>
      </div>
      <button id="clear-history" type="button">Clear history</button>
    </header>
    <section id="downloads" aria-live="polite"></section>
    <div id="empty" hidden><strong>No downloads yet</strong>Files you download will appear here.</div>
  </main>
  <script>
    const api = window.downloadManagerAPI
    const downloads = new Map()
    const list = document.getElementById('downloads')
    const empty = document.getElementById('empty')

    function formatBytes (bytes) {
      if (!bytes) return '0 B'
      const units = ['B', 'KB', 'MB', 'GB', 'TB']
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1)
      return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`
    }

    function statusText (item) {
      if (item.status === 'completed') return 'Completed'
      if (item.status === 'cancelled') return 'Cancelled'
      if (item.status === 'interrupted') return 'Interrupted'
      if (item.status === 'paused') return 'Paused'
      return 'Downloading'
    }

    function typeLabel (item) {
      const name = item.name || ''
      const extension = name.includes('.') ? name.split('.').pop().toUpperCase() : 'FILE'
      return extension.slice(0, 5)
    }

    function render () {
      list.replaceChildren()
      const items = Array.from(downloads.values()).sort((a, b) => b.timestamp - a.timestamp)
      empty.hidden = items.length !== 0
      items.forEach(item => list.appendChild(renderItem(item)))
    }

    function renderItem (item) {
      const received = Number(item.size?.received || 0)
      const total = Number(item.size?.total || 0)
      const percentage = total > 0 ? Math.min(100, received / total * 100) : 0
      const article = document.createElement('article')
      article.className = 'download'
      article.innerHTML = `
        <div class="download-top">
          <div class="file-icon">${typeLabel(item)}</div>
          <div class="details">
            <div class="name" title="${escapeHtml(item.name || 'Downloaded file')}">${escapeHtml(item.name || 'Downloaded file')}</div>
            <div class="meta">${formatBytes(received)}${total ? ` / ${formatBytes(total)}` : ''}${item.mimeType ? ` - ${escapeHtml(item.mimeType)}` : ''}</div>
          </div>
          <div class="status">${statusText(item)}</div>
        </div>
        <div class="progress-track" ${item.status === 'completed' || item.status === 'interrupted' || item.status === 'cancelled' ? 'hidden' : ''}><div class="progress" style="width:${percentage}%"></div></div>
        <div class="stats"><span>${item.speed ? `${formatBytes(item.speed)}/s` : ''}</span><span>${total ? `${Math.round(percentage)}%` : ''}</span></div>
        <div class="actions"></div>`

      const actions = article.querySelector('.actions')
      if (item.status === 'completed') {
        actions.append(button('Open File', () => openFile(item.path)))
        actions.append(button('Open in Folder', () => openFolder(item.path)))
      }
      actions.append(button('Remove from history', () => removeItem(item.id), 'remove'))
      return article
    }

    function escapeHtml (value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character])
    }

    function button (label, handler, className) {
      const element = document.createElement('button')
      element.type = 'button'
      element.textContent = label
      if (className) element.className = className
      element.addEventListener('click', handler)
      return element
    }

    async function openFile (path) {
      if (!await api.openFile(path)) alert('File is no longer available at this location.')
    }

    async function openFolder (path) {
      if (!await api.openFolder(path)) alert('File is no longer available at this location.')
    }

    async function removeItem (id) {
      if (confirm('Remove this download from history?')) await api.remove(id)
    }

    document.getElementById('clear-history').addEventListener('click', async () => {
      if (downloads.size && confirm('Clear download history?\n\nYour downloaded files will NOT be deleted.')) await api.clear()
    })

    api.onUpdate(item => {
      if (item.clear) downloads.clear()
      else if (item.removed) downloads.delete(item.id)
      else downloads.set(item.id, item)
      render()
    })

    api.list().then(items => {
      items.forEach(item => downloads.set(item.id, item))
      render()
    })
  </script>
</body>
</html>
